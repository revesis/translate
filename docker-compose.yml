# docker compose / podman-compose
#
#   cp .env.example .env      # optional: set GT_API_KEY / GT_PROXY
#   docker compose up -d --build
#   curl http://127.0.0.1:8770/health
#
# One container. Chromium runs as a child process of the API for image OCR; it
# publishes nothing and is not reachable from outside.
services:
  gt-api:
    build: .
    image: gt-api:1.0
    container_name: gt-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8770:8770"

    environment:
      # Inside the container the server must bind 0.0.0.0 or the published port
      # cannot reach it; exposure is limited by the host side of `ports` above.
      GT_HOST: "0.0.0.0"
      GT_PORT: "8770"
      GT_DEFAULT_TL: "${GT_DEFAULT_TL:-zh-CN}"
      # Optional bearer token. Empty = no auth.
      GT_API_KEY: "${GT_API_KEY:-}"
      # Needed only when this host cannot reach Google directly.
      GT_PROXY: "${GT_PROXY:-}"
      # Point at a mirror / self-hosted gateway if you have one.
      GT_ENDPOINT: "${GT_ENDPOINT:-}"
      # In-process signer. GT_BROWSER=0 runs text-only: no chromium, and
      # /translate/image then returns the image without OCR text.
      GT_BROWSER: "${GT_BROWSER:-/usr/bin/chromium}"
      GT_SIGNER_URL: "${GT_SIGNER_URL:-}"

    # The app writes nothing; chromium writes only its profile under /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m

    shm_size: "512m"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
